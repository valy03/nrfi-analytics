services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nrfi
      POSTGRES_PASSWORD: nrfi
      POSTGRES_DB: nrfi_analytics
    ports:
      - "5432:5432"
    volumes:
      - nrfi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrfi -d nrfi_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nrfi:nrfi@db:5432/nrfi_analytics
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nrfi:nrfi@db:5432/nrfi_analytics
      # Plain print() calls otherwise sit in a block buffer and never reach
      # `docker compose logs` until it fills — which for a once-a-day loop
      # could be days. Unbuffered is what makes this an actually observable
      # unattended job instead of a silent one.
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.prediction.scheduler

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  nrfi_db_data:
