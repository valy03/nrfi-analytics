services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nrfi
      POSTGRES_PASSWORD: nrfi
      POSTGRES_DB: nrfi_analytics
    ports:
      - "5432:5432"
    volumes:
      - nrfi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrfi -d nrfi_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # The Dockerfile's own CMD is the production default (no --reload,
    # Render-assigned $PORT) — local dev overrides it here to add hot
    # reload back, since the bind-mounted volume below is what makes that
    # useful in the first place.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nrfi:nrfi@db:5432/nrfi_analytics
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    # Opt-in: a plain `docker compose up` should not silently bring this
    # back after it's been stopped (see docs/milestones.md M7 — running it
    # continuously needs a laptop that stays awake for days, which isn't
    # worth doing until M12 puts it somewhere that actually stays up).
    # Start it deliberately with `docker compose --profile scheduler up -d`.
    profiles: ["scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nrfi:nrfi@db:5432/nrfi_analytics
      # Plain print() calls otherwise sit in a block buffer and never reach
      # `docker compose logs` until it fills — which for a once-a-day loop
      # could be days. Unbuffered is what makes this an actually observable
      # unattended job instead of a silent one.
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.prediction.scheduler

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      # Docker Desktop's Windows bind mount doesn't reliably forward
      # filesystem change events into the container, so Vite's file
      # watcher (even with server.watch.usePolling in vite.config.ts)
      # silently never fires and keeps serving stale transforms. This is
      # the env var chokidar itself checks, which several tools in the
      # dependency chain read more reliably than Vite's passthrough config.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  nrfi_db_data:
